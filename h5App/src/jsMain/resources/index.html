<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kuikly-Web-Render</title>
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 终端渲染：xterm.js（MIT，本地 vendor，见 resources/lib/） -->
    <link rel="stylesheet" href="lib/xterm.css">
    <script src="lib/xterm.js"></script>
    <script src="lib/kr-terminal.js"></script>
</head>
<style>
    *{
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
        overflow: hidden
    }
    /* 隐藏输入框边框的样式 */
    input:focus {
      outline: none;
    }
    /* toast提示框的样式：窗口底部、宽度自适应文字（不占满整行） */
    .toast-wrapper {
        position: fixed;
        z-index: 100000;
        height: auto;
        width: auto;
        max-width: 80vw;
        display: flex;
        justify-content: center;
        align-items: center;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        background-color: transparent;
    }
    .toast-content {
        display: flex;
        font-size: 13px;
        line-height: 20px;
        padding: 8px 14px;
        width: auto;
        border: none;
        border-radius: 8px;
        background-color: rgba(0, 0, 0, 0.82);
        color: #ffffff;
        justify-content: center;
        white-space: nowrap;
        max-width: 80vw;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    /* 隐藏滚动条的样式 */
    .list-no-scrollbar {
        scrollbar-width: none;
    }
    .list-no-scrollbar::-webkit-scrollbar {
        display: none;
    }
    /* 转菊花的动画样式 */
    @keyframes activityIndicatorRotate {
        0% { transform: rotate(0deg) }
        100% { transform: rotate(360deg) }
    }
</style>
<body>
<div id="root"></div>
<script type="text/javascript" src="nativevue2.js"></script>
<script type="text/javascript">
    // Keep both bridge shapes available. Kotlin/JS exports the bridge under
    // com.tencent.kuikly.core.nvi, while older Web render bundles call the
    // window-level function directly.
    (function (global) {
        var nvi = global.com && global.com.tencent && global.com.tencent.kuikly &&
            global.com.tencent.kuikly.core && global.com.tencent.kuikly.core.nvi;
        if (nvi && typeof nvi.callKotlinMethod === 'function') {
            global.callKotlinMethod = nvi.callKotlinMethod;
        }
        if (nvi && typeof nvi.registerCallNative === 'function') {
            global.registerCallNative = nvi.registerCallNative;
        }
    })(window);
</script>
<script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/libpag@4.3.51/lib/libpag.umd.min.js"></script>
<script type="text/javascript" src="h5App.js"></script>
</body>
</html>
