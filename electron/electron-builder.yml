appId: com.tencent.kuikly.sftp.desktop
productName: Kuikly SFTP
directories:
  output: dist
files:
  - main.js
  - preload.js
  - resources/**
  - package.json
# 打包版必须内置网关（含 ssh2 依赖）：复制为 Resources/gateway，main.js 按 app.isPackaged 解析
extraResources:
  - from: ../sftp-gateway
    to: gateway
    filter:
      - "**/*"
      - "!data/**"
      - "!**/*.log"
mac:
  target:
    - dmg
  category: public.app-category.utilities
win:
  target:
    - nsis
linux:
  target:
    - AppImage
